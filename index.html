<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Defensor de Texel</title>
<meta name="description" content="RPG de colección de criaturas inspirado en D.o.T.: Defender of Texel">
<meta name="theme-color" content="#171009">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Defensor de Texel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="resource texel" title="Texel">🪙 <span id="texelVal">0</span></div>
    <div class="resource gemas" title="Gemas">💎 <span id="gemasVal">0</span></div>
    <div class="resource energia" title="Energía">⚡ <span id="energiaVal">0</span>/<span id="energiaMax">0</span></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Ajustes">⚙️</button>
  </header>

  <main id="screens">

    <section id="screen-mapa" class="screen active">
      <h2 class="screen-title">Mapa</h2>
      <div id="zoneList"></div>
      <div id="stageList" class="hidden"></div>
    </section>

    <section id="screen-banda" class="screen">
      <h2 class="screen-title">Banda</h2>
      <div class="panel">
        <h3>Formación</h3>
        <div class="formation-grid" id="formationGrid"></div>
      </div>
      <h2 class="screen-title">Colección <span class="badge" id="rosterCount">0</span></h2>
      <div class="creature-grid" id="rosterGrid"></div>
    </section>

    <section id="screen-invocar" class="screen">
      <h2 class="screen-title">Invocación</h2>
      <div id="summonPanels"></div>
    </section>

    <section id="screen-arena" class="screen">
      <h2 class="screen-title">Arena</h2>
      <div class="panel" id="arenaRankPanel"></div>
      <div class="panel" id="arenaEnemyPanel"></div>
    </section>

    <section id="screen-equipo" class="screen">
      <h2 class="screen-title">Equipo <span class="badge" id="gearCount">0</span></h2>
      <div class="item-grid" id="gearGrid"></div>
      <div class="empty-hint hidden" id="gearEmptyHint">Sin objetos todavía. Consíguelos superando etapas.</div>
    </section>

  </main>

  <nav id="bottomnav">
    <button class="nav-btn active" data-screen="mapa"><span class="nav-icon">🗺️</span><span>Mapa</span></button>
    <button class="nav-btn" data-screen="banda"><span class="nav-icon">🐾</span><span>Banda</span></button>
    <button class="nav-btn" data-screen="invocar"><span class="nav-icon">🔮</span><span>Invocar</span></button>
    <button class="nav-btn" data-screen="arena"><span class="nav-icon">⚔️</span><span>Arena</span></button>
    <button class="nav-btn" data-screen="equipo"><span class="nav-icon">🎒</span><span>Equipo</span></button>
  </nav>
</div>

<!-- Batalla -->
<div id="battleOverlay" class="overlay hidden">
  <div class="battle-header">
    <span id="battleTitle">Batalla</span>
    <button id="battleSkipBtn" class="mini-btn">Saltar »</button>
  </div>
  <div class="battle-rows">
    <div class="battle-side" id="battleEnemySide">
      <div class="active-row" id="enemyActiveRow"></div>
      <div class="queued-rows" id="enemyQueuedRows"></div>
    </div>
    <div class="battle-vs">VS</div>
    <div class="battle-side" id="battlePlayerSide">
      <div class="active-row" id="playerActiveRow"></div>
      <div class="queued-rows" id="playerQueuedRows"></div>
    </div>
  </div>
  <div class="battle-log" id="battleLog"></div>
  <div id="battleResult" class="hidden">
    <div id="battleResultBody"></div>
    <button class="primary-btn" id="battleCloseBtn">Continuar</button>
  </div>
</div>

<div id="fighterModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="fighterModalClose">✕</button>
    <div id="fighterModalBody"></div>
  </div>
</div>

<div id="gearModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="gearModalClose">✕</button>
    <div id="gearModalBody"></div>
  </div>
</div>

<div id="pickerModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="pickerModalClose">✕</button>
    <div id="pickerModalBody"></div>
  </div>
</div>

<div id="summonRevealModal" class="modal hidden">
  <div class="modal-box reveal-box">
    <div id="summonRevealBody"></div>
    <button class="primary-btn hidden" id="summonRevealClose">Continuar</button>
  </div>
</div>

<div id="offlineModal" class="modal hidden">
  <div class="modal-box">
    <h3>🌙 Bienvenido de nuevo</h3>
    <div id="offlineBody"></div>
    <button class="primary-btn" id="offlineClose">Continuar</button>
  </div>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <button class="modal-close" id="settingsModalClose">✕</button>
    <h3>⚙️ Ajustes</h3>
    <p class="settings-info">Defensor de Texel — progreso guardado automáticamente en este dispositivo.</p>
    <button class="danger-btn" id="resetBtn">Reiniciar partida</button>
  </div>
</div>

<div id="toastContainer"></div>

<script src="js/data.js"></script>
<script src="js/sprite.js"></script>
<script src="js/state.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
